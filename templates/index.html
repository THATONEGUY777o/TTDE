<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DTE Encoder</title>

    <style>
        body {
            background: #111318;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .box {
            max-width: 800px;
            margin: auto;
            background: #1b1e25;
            padding: 25px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background: #0d0f13;
            border-radius: 8px;
            word-break: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>DTE Encoder</h1>

    <form method="POST">

        <textarea
            name="text"
            placeholder="input your text here:"
        ></textarea>

        <br>

        <button type="submit">Encode</button>

    </form>

    {% if encoded %}
        <div class="output">{{ encoded }}</div>
    {% endif %}

</div>

</body>
</html>
