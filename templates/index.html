<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>text to decimal encoder and decoder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
    margin: 0;
    min-height: 100vh;

    background-image: url("/static/background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #ff7a00;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
        }

        /* Rain */
        .rain {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .drop {
            position: absolute;
            top: -100px;
            width: 2px;
            height: 80px;

            background: linear-gradient(
                transparent,
                #ff7a00
            );

            opacity: 0.65;
            animation: fall linear infinite;
        }

        @keyframes fall {
            from {
                transform: translateY(-120px);
            }

            to {
                transform: translateY(110vh);
            }
        }

        /* Main page */
        .container {
            position: relative;
            z-index: 1;

            width: 90%;
            max-width: 900px;

            margin: 50px auto;
            padding: 30px;

            background: rgba(5, 5, 5, 0.82);

            border: 1px solid #ff7a00;
            border-radius: 15px;

            box-shadow:
                0 0 10px #ff7a00,
                0 0 30px rgba(255, 122, 0, 0.4);
        }

        h1,
        h2,
        p,
        label,
        button,
        .output {
            color: #ff7a00;

            text-shadow:
                0 0 5px #ff7a00,
                0 0 10px #ff7a00,
                0 0 20px rgba(255, 122, 0, 0.8);
        }

        h1 {
            text-align: center;
            font-size: 42px;
            letter-spacing: 3px;
            margin-top: 0;
        }

        h2 {
            margin-top: 0;
        }

        .block {
            margin-top: 30px;
            padding: 25px;

            background: rgba(0, 0, 0, 0.45);

            border: 1px solid rgba(255, 122, 0, 0.7);
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            min-height: 140px;

            margin-top: 10px;
            padding: 15px;

            background: rgba(0, 0, 0, 0.8);

            color: #ff7a00;

            border: 1px solid #ff7a00;
            border-radius: 8px;

            outline: none;

            font-size: 16px;
            font-family: monospace;

            resize: vertical;

            box-shadow:
                0 0 8px rgba(255, 122, 0, 0.5);
        }

        textarea::placeholder {
            color: #ff7a00;
            opacity: 0.6;
        }

        textarea:focus {
            box-shadow:
                0 0 8px #ff7a00,
                0 0 20px rgba(255, 122, 0, 0.5);
        }

        button {
            margin-top: 15px;

            padding: 12px 25px;

            background: rgba(0, 0, 0, 0.8);

            border: 1px solid #ff7a00;
            border-radius: 8px;

            color: #ff7a00;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 8px rgba(255, 122, 0, 0.5);

            transition: 0.2s;
        }

        button:hover {
            background: #ff7a00;
            color: black;

            text-shadow: none;

            box-shadow:
                0 0 10px #ff7a00,
                0 0 30px #ff7a00;
        }

        .output {
            margin-top: 20px;
            padding: 20px;

            min-height: 60px;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid #ff7a00;
            border-radius: 8px;

            font-family: monospace;
            font-size: 16px;

            white-space: pre-wrap;
            word-break: break-word;

            box-shadow:
                inset 0 0 10px rgba(255, 122, 0, 0.2),
                0 0 10px rgba(255, 122, 0, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                padding: 20px;
                margin: 25px auto;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Rain -->
    <div class="rain" id="rain"></div>

    <div class="container">

        <h1>Text to Decimal Encoder and Decoder</h1>

        <!-- ENCODER -->
        <div class="block">

            <h2>Encoder</h2>

            <p>Convert text into decimal values.</p>

            <form method="POST">

                <label for="text">
                    Input your text:
                </label>

                <textarea
                    id="text"
                    name="text"
                    placeholder="input your text here:"
                ></textarea>

                <button type="submit">
                    ENCODE
                </button>

            </form>

            {% if encoded %}
                <div class="output">{{ encoded }}</div>
            {% endif %}

        </div>


        <!-- DECODER -->
        <div class="block">

            <h2>Decoder</h2>

            <p>Convert decimal values back into text.</p>

            <form method="POST">

                <label for="decode">
                    Input your decimal code:
                </label>

                <textarea
                    id="decode"
                    name="decode"
                    placeholder='Example: "2.224" "1.391" "6.390"'
                ></textarea>

                <button type="submit">
                    DECODE
                </button>

            </form>

            {% if decoded %}
                <div class="output">{{ decoded }}</div>
            {% endif %}

        </div>

    </div>


    <script>
        const rain = document.getElementById("rain");

        for (let i = 0; i < 100; i++) {

            const drop = document.createElement("div");

            drop.classList.add("drop");

            drop.style.left =
                Math.random() * 100 + "%";

            drop.style.height =
                (40 + Math.random() * 100) + "px";

            drop.style.animationDuration =
                (0.5 + Math.random() * 1.5) + "s";

            drop.style.animationDelay =
                Math.random() * 2 + "s";

            rain.appendChild(drop);
        }
    </script>

</body>
</html>
